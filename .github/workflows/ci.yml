name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  # Every Nest package moves together: a mixed install is what a
  # WebSocket or microservice case would fail on, not the adapter.
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nest: ['11', '12']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run:
          bun add --exact @nestjs/common@${{ matrix.nest }}.x
          @nestjs/core@${{ matrix.nest }}.x
          @nestjs/websockets@${{ matrix.nest }}.x
          @nestjs/microservices@${{ matrix.nest }}.x
      - run: bun run typecheck && bun test && bun run build
